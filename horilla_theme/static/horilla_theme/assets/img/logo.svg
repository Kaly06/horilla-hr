<svg width="75" height="58" viewBox="0 0 75 58" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Acme HR">
  <defs>
    <linearGradient id="acmeBadgeGrad" x1="7" y1="4" x2="55" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6b78f8"/>
      <stop offset="1" stop-color="#3f49ad"/>
    </linearGradient>
    <!-- badge silhouette: everything is clipped to this -->
    <clipPath id="acmeBadgeClip">
      <rect x="7" y="4" width="48" height="48" rx="13.92"/>
    </clipPath>
    <!-- the shoulder is a stroked ring cut at its widest point -->
    <clipPath id="acmeShoulderClip">
      <rect x="0" y="0" width="75" height="51.76"/>
    </clipPath>
  </defs>

  <rect x="7" y="4" width="48" height="48" rx="13.92" fill="url(#acmeBadgeGrad)"/>

  <g clip-path="url(#acmeBadgeClip)">
    <circle cx="27.16" cy="22" r="6.48" fill="#ffffff"/>
    <circle cx="37" cy="24.88" r="4.70" fill="#ffffff"/>
    <g clip-path="url(#acmeShoulderClip)">
      <circle cx="28.60" cy="50.08" r="14.40" fill="none" stroke="#ffffff" stroke-width="5.28"/>
    </g>
  </g>
</svg>
